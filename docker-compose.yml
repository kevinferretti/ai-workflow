name: ${COMPOSE_PROJECT_NAME:-ai-workflow}

services:
  workspace:
    build:
      context: .
      dockerfile: infra/workspace/Dockerfile
      args:
        CODEX_NPM_VERSION: ${CODEX_NPM_VERSION:-0.132.0}
        NODE_MAJOR: ${NODE_MAJOR:-22}
        USER_UID: ${WORKSPACE_UID:-1000}
        USER_GID: ${WORKSPACE_GID:-1000}
        TZ: ${TZ:-UTC}
    image: ${WORKSPACE_IMAGE:-ai-workflow/workspace:local}
    container_name: ${WORKSPACE_CONTAINER_NAME:-ai-workspace}
    hostname: ${WORKSPACE_HOSTNAME:-ai-workspace}
    init: true
    tty: true
    stdin_open: true
    restart: unless-stopped
    working_dir: /workspace/platform
    environment:
      CODEX_HOME: /home/codex/.codex
      PLATFORM_ROOT: /workspace/platform
      WORKSPACE_REPOS: /workspace/repos
      SHELL: /usr/bin/zsh
      TZ: ${TZ:-UTC}
    volumes:
      - .:/workspace/platform
      - ${WORKSPACE_REPOS_DIR:-./workspace/repos}:/workspace/repos
      - ${WORKSPACE_CODEX_STATE_DIR:-./.state/codex}:/home/codex/.codex
      - ${WORKSPACE_GH_STATE_DIR:-./.state/gh}:/home/codex/.config/gh
      - ${WORKSPACE_SSH_STATE_DIR:-./.state/ssh}:/home/codex/.ssh
      - ${WORKSPACE_COMMAND_HISTORY_DIR:-./.state/commandhistory}:/commandhistory
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    healthcheck:
      test: ["CMD-SHELL", "codex --version >/dev/null 2>&1 && test -d /workspace/platform && test -w /workspace/repos"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: ["sleep", "infinity"]
